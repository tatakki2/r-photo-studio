<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R — AI Photo Studio</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090c12;color:#eef3ff}header{padding:24px 18px;border-bottom:1px solid #283144;background:#111724}h1{margin:0;font-size:28px;letter-spacing:.08em}small,.muted{color:#9caac1}main{max-width:1000px;margin:auto;padding:20px 16px 90px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button,button,select,input,textarea{font:inherit}button{background:#1b2637;color:white;border:1px solid #39485e;border-radius:12px;padding:11px 14px;cursor:pointer}.tabs button.active,.primary{background:#2479ed;border-color:#2479ed}section{background:#121a27;border:1px solid #273449;border-radius:18px;padding:18px;margin-bottom:15px}h2{font-size:20px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}.tile{background:#192436;border:2px solid transparent;border-radius:12px;overflow:hidden;position:relative}.tile.selected{border-color:#49a1ff}.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.tile .caption{padding:8px;font-size:12px;overflow-wrap:anywhere}.tile .actions{display:flex;gap:4px;padding:5px}.tile button{font-size:12px;padding:6px;flex:1}input[type=file]{max-width:100%;margin-top:12px}label{display:block;margin:12px 0 6px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}select,textarea,input[type=text]{width:100%;background:#0e1521;color:#fff;border:1px solid #39485e;border-radius:9px;padding:11px}textarea{min-height:95px}.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.preview img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}.badge{display:inline-block;background:#1b344f;border-radius:8px;padding:5px 8px;color:#a7d2ff}.hidden{display:none}.warn{color:#ffd18d;font-size:13px;line-height:1.7}</style></head><body><header><h1>R <span style="color:#56a4ff">/</span> AI PHOTO STUDIO</h1><small>Private photo workspace · Local prototype</small></header><main><nav class="tabs" id="tabs"></nav><div id="content"></div></main><script>
const categories=['FACE','POSE','BACKGROUND','OPTIONS'];let active='FACE',db,selected={},items={};const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('RPhotoStudio',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function tx(mode='readonly'){return db.transaction('photos',mode).objectStore('photos')}function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function refresh(){items={};for(let c of categories)items[c]=(await req(tx().getAll())).filter(x=>x.cat===c);render()}function nav(){ $('#tabs').innerHTML=[...categories,'GENERATE'].map(c=>`<button class="${active===c?'active':''}" data-tab="${c}">${c}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}function tile(x,c){let url=URL.createObjectURL(x.blob);return `<div class="tile ${selected[c]===x.id?'selected':''}"><img src="${url}" alt="${esc(x.name)}"><div class="caption">${esc(x.name)}</div><div class="actions"><button data-pick="${x.id}" data-cat="${c}">${selected[c]===x.id?'✓ 選択中':'選択'}</button><button data-del="${x.id}">削除</button></div></div>`}function render(){nav();if(active==='GENERATE')return renderGenerate();$('#content').innerHTML=`<section><h2>${active}</h2><p class="muted">${{FACE:'顔・髪型の参考画像',POSE:'顔を無視してポーズ・構図を参照',BACKGROUND:'背景の参考写真',OPTIONS:'衣装・表情・小物などの参考写真'}[active]}</p><label class="badge">写真ライブラリから追加</label><input id="upload" type="file" accept="image/*" multiple><p class="muted">登録済み：${items[active].length}枚</p><div class="grid">${items[active].map(x=>tile(x,active)).join('')}</div></section>`;$('#upload').onchange=async e=>{for(let f of e.target.files){await req(tx('readwrite').put({id:crypto.randomUUID(),cat:active,name:f.name,blob:f,created:Date.now()}))}await refresh()};bindTiles()}function bindTiles(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected[b.dataset.cat]=b.dataset.pick;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('この写真を削除しますか？'))return;await req(tx('readwrite').delete(b.dataset.del));for(let k in selected)if(selected[k]===b.dataset.del)delete selected[k];await refresh()})}function chosen(c){return items[c].find(x=>x.id===selected[c])}function renderGenerate(){let cards=categories.map(c=>{let x=chosen(c);return `<div><b>${c}</b><div style="margin-top:8px">${x?`<img src="${URL.createObjectURL(x.blob)}" alt="${esc(c)}">`:'<div style="aspect-ratio:3/4;background:#1c2635;border-radius:8px;display:grid;place-items:center;color:#8b9bb1">未選択</div>'}</div><small>${x?esc(x.name):'フォルダで選択'}</small></div>`}).join('');$('#content').innerHTML=`<section><h2>生成スタジオ</h2><p class="muted">4種類の参照写真を組み合わせる</p><div class="preview">${cards}</div><div class="row"><div><label>アスペクト比</label><select id="ratio"><option>9:16</option><option>3:4</option><option>1:1</option><option>16:9</option></select></div><div><label>枚数</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div><label>追加指示</label><textarea id="instructions" placeholder="例：自然なスマホ写真、衣装は維持、カメラ目線にしない"></textarea><button class="primary" id="make">生成内容を確認</button><p class="warn">※ この初期版は端末内の写真管理と生成設定の試作です。AI画像生成APIへの送信・実際の画像生成は未接続です。APIキーをブラウザ内に保存する実装は安全でないため採用しません。</p><div id="summary"></div></section>`;$('#make').onclick=()=>{let lines=['R — 生成設定','FACE: '+(chosen('FACE')?.name||'なし'),'POSE: '+(chosen('POSE')?.name||'なし'),'BACKGROUND: '+(chosen('BACKGROUND')?.name||'なし'),'OPTIONS: '+(chosen('OPTIONS')?.name||'なし'),'画角: '+$('#ratio').value,'枚数: '+$('#count').value,'追加指示: '+$('#instructions').value];$('#summary').innerHTML='<h3>設定内容</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(lines.join('\n'))+'</pre>'}}(async()=>{try{db=await openDB();await refresh()}catch(e){$('#content').innerHTML='<section>このブラウザでは保存機能を使用できません。SafariやChromeで開いてください。</section>'}})();</script></body></html>
